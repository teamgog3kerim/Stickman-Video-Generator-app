openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Username and password account operations
  - name: projects
    description: User-owned video projects
  - name: storyboards
    description: AI-assisted storyboard drafting
  - name: videos
    description: Local video rendering
  - name: social
    description: Per-account social publishing status
  - name: admin
    description: Administrator account management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: Invalid account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out of the current account
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/preferences:
    patch:
      operationId: updateUserPreferences
      tags: [auth]
      summary: Save the account language preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesInput"
      responses:
        "200":
          description: Updated account preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the current account projects
      responses:
        "200":
          description: User-owned projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    put:
      operationId: updateProject
      tags: [projects]
      summary: Update a project owned by the current account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{id}/approve:
    post:
      operationId: approveProject
      tags: [projects]
      summary: Approve a project brief for rendering
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved project brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Brief is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project owned by the current account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storyboards/generate:
    post:
      operationId: generateStoryboard
      tags: [storyboards]
      summary: Draft a detailed storyboard from a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryboardGenerateInput"
      responses:
        "200":
          description: Generated editable storyboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryboardDraft"
  /videos/render:
    post:
      operationId: renderVideo
      tags: [videos]
      summary: Render a project as a downloadable MP4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoRenderInput"
      responses:
        "200":
          description: Completed video for an approved project
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid video brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /videos/downloads:
    get:
      operationId: listDownloadedVideos
      tags: [videos]
      summary: List MP4 renders saved by the current account
      responses:
        "200":
          description: Saved MP4 renders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadedVideo"
  /videos/downloads/{id}:
    delete:
      operationId: deleteDownloadedVideo
      tags: [videos]
      summary: Delete a saved MP4 render and its stored file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Saved video and stored file deleted
        "404":
          description: Saved video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Stored video file could not be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /videos/downloads/{id}/file:
    get:
      operationId: downloadSavedVideo
      tags: [videos]
      summary: Download a saved MP4 render
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved MP4 file
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Saved video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /videos/downloads/{id}/preview:
    get:
      operationId: previewSavedVideo
      tags: [videos]
      summary: Stream a saved MP4 for inline playback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved MP4 stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Saved video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /videos/downloads/{id}/share-copy:
    post:
      operationId: generateVideoShareCopy
      tags: [videos]
      summary: Generate share captions and hashtags for saved video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Platform-specific captions and hashtag suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoShareCopyResponse"
        "404":
          description: Saved video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Share copy generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Social copy generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /social/providers:
    get:
      operationId: listSocialProviders
      tags: [social]
      summary: Show publishing provider setup and account status
      responses:
        "200":
          description: Social provider status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialProviderStatus"
  /social/providers/{provider}/profile:
    patch:
      operationId: updateSocialProviderProfile
      tags: [social]
      summary: Save or clear a social profile URL for the current account
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [youtube, instagram, tiktok]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialProfileUrlInput"
      responses:
        "200":
          description: Updated provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialProviderStatus"
        "400":
          description: Invalid profile URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List app accounts for an administrator
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Change an account role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: Updated account role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid role change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [admin]
      summary: Create a one-time temporary password for an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Temporary password, shown only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPassword"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    UserRole:
      type: string
      enum: [user, admin]
    LanguageCode:
      type: string
      enum: [en, am, ar]
    SessionUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        mustChangePassword:
          type: boolean
        locale:
          $ref: "#/components/schemas/LanguageCode"
        contentLanguage:
          $ref: "#/components/schemas/LanguageCode"
      required: [id, fullName, username, role, mustChangePassword, locale, contentLanguage]
    SignUpInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]+$"
        password:
          type: string
          minLength: 6
          maxLength: 128
        bootstrapToken:
          type: string
          maxLength: 256
        locale:
          $ref: "#/components/schemas/LanguageCode"
        contentLanguage:
          $ref: "#/components/schemas/LanguageCode"
      required: [fullName, username, password]
    UserPreferencesInput:
      type: object
      properties:
        locale:
          $ref: "#/components/schemas/LanguageCode"
        contentLanguage:
          $ref: "#/components/schemas/LanguageCode"
      required: [locale, contentLanguage]
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [username, password]
    PasswordChangeInput:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 6
          maxLength: 128
      required: [currentPassword, newPassword]
    CartoonCastMember:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 40
        role:
          type: string
          maxLength: 60
        personality:
          type: string
          maxLength: 120
        shirtColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        skinTone:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        hairStyle:
          type: string
          enum: [short, curly, long]
        accessory:
          type: string
          enum: [none, cap, glasses, headband, backpack, bow]
      required: [id, name, role, shirtColor, skinTone, hairStyle, accessory]
    Scene:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        narration:
          type: string
        visualDirection:
          type: string
        seconds:
          type: integer
          minimum: 1
          maximum: 90
        shotType:
          type: string
        visualMetaphor:
          type: string
        onScreenText:
          type: string
        cameraMove:
          type: string
        soundCue:
          type: string
        entrance:
          type: string
          enum: [already-on-stage, walk-in-left, walk-in-right, run-in-left, run-in-right, pop-in]
        groupAction:
          type: string
          enum: [story-directed, talk-and-react, walk-together, point-together, celebrate-together]
        exit:
          type: string
          enum: [hold, walk-off-left, walk-off-right, run-off-left, run-off-right, exit-together]
        transitionToNext:
          type: string
          enum: [cut, dissolve, wipe-left, wipe-right, match-left, match-right]
      required: [id, title, narration, visualDirection, seconds]
    ProjectInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        topic:
          type: string
          maxLength: 2000
        script:
          type: string
          maxLength: 20000
        hook:
          type: string
          maxLength: 1000
        takeaway:
          type: string
          maxLength: 1000
        engine:
          type: string
          enum: [model, code]
        styleId:
          type: string
          maxLength: 20
        aspectRatio:
          type: string
          enum: ["16:9", "9:16"]
        durationSeconds:
          type: integer
          minimum: 15
          maximum: 600
        voiceover:
          type: boolean
        subtitles:
          type: boolean
        soundEffects:
          type: boolean
        contentLanguage:
          $ref: "#/components/schemas/LanguageCode"
        scenes:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/Scene"
        cartoonCast:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CartoonCastMember"
      required:
        - title
        - topic
        - script
        - hook
        - takeaway
        - engine
        - styleId
        - aspectRatio
        - durationSeconds
        - voiceover
        - subtitles
        - soundEffects
        - contentLanguage
        - scenes
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            approvedAt:
              type: ["string", "null"]
              format: date-time
          required: [id, createdAt, updatedAt, approvedAt]
    StoryboardGenerateInput:
      type: object
      properties:
        topic:
          type: string
          minLength: 3
          maxLength: 2000
        sourceScript:
          type: string
          maxLength: 20000
        styleId:
          type: string
          maxLength: 20
        aspectRatio:
          type: string
          enum: ["16:9", "9:16"]
        durationSeconds:
          type: integer
          minimum: 15
          maximum: 600
        contentLanguage:
          $ref: "#/components/schemas/LanguageCode"
        cartoonCast:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CartoonCastMember"
      required: [topic, styleId, aspectRatio, durationSeconds, contentLanguage]
    StoryboardDraft:
      type: object
      properties:
        title:
          type: string
        script:
          type: string
        hook:
          type: string
        takeaway:
          type: string
        scenes:
          type: array
          minItems: 3
          maxItems: 12
          items:
            $ref: "#/components/schemas/Scene"
      required: [title, script, hook, takeaway, scenes]
    VideoRenderInput:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
      required: [projectId]
    DownloadedVideo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: ["string", "null"]
          format: uuid
        title:
          type: string
        topic:
          type: string
        aspectRatio:
          type: string
          enum: ["16:9", "9:16"]
        contentLanguage:
          $ref: "#/components/schemas/LanguageCode"
        durationSeconds:
          type: integer
        fileName:
          type: string
        byteSize:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, projectId, title, topic, aspectRatio, contentLanguage, durationSeconds, fileName, byteSize, createdAt]
    SocialSharePlatformCopy:
      type: object
      properties:
        platform:
          type: string
          enum: [youtube, instagram, tiktok]
        title:
          type: string
        caption:
          type: string
        hashtags:
          type: array
          items:
            type: string
      required: [platform, title, caption, hashtags]
    VideoShareCopyResponse:
      type: object
      properties:
        copies:
          type: array
          items:
            $ref: "#/components/schemas/SocialSharePlatformCopy"
        trendNote:
          type: string
      required: [copies, trendNote]
    SocialProviderStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [youtube, instagram, tiktok]
        label:
          type: string
        configured:
          type: boolean
        connected:
          type: boolean
        accountName:
          type: ["string", "null"]
        profileUrl:
          type: ["string", "null"]
        note:
          type: string
      required: [provider, label, configured, connected, accountName, profileUrl, note]
    SocialProfileUrlInput:
      type: object
      properties:
        profileUrl:
          type: ["string", "null"]
          format: uri
          maxLength: 500
      required: [profileUrl]
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time
        projectCount:
          type: integer
        mustChangePassword:
          type: boolean
      required:
          - id
          - fullName
          - username
          - role
          - createdAt
          - projectCount
          - mustChangePassword
    UserRoleInput:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
      required: [role]
    TemporaryPassword:
      type: object
      properties:
        temporaryPassword:
          type: string
        username:
          type: string
      required: [temporaryPassword, username]

