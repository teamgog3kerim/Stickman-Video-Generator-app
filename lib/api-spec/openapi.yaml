openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Username and password account operations
  - name: projects
    description: User-owned video projects
  - name: storyboards
    description: AI-assisted storyboard drafting
  - name: videos
    description: Local video rendering
  - name: social
    description: Per-account social publishing status
  - name: admin
    description: Administrator account management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: Invalid account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out of the current account
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the current account projects
      responses:
        "200":
          description: User-owned projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    put:
      operationId: updateProject
      tags: [projects]
      summary: Update a project owned by the current account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{id}/approve:
    post:
      operationId: approveProject
      tags: [projects]
      summary: Approve a project brief for rendering
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved project brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Brief is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project owned by the current account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storyboards/generate:
    post:
      operationId: generateStoryboard
      tags: [storyboards]
      summary: Draft a detailed storyboard from a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryboardGenerateInput"
      responses:
        "200":
          description: Generated editable storyboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryboardDraft"
  /videos/render:
    post:
      operationId: renderVideo
      tags: [videos]
      summary: Render a project as a downloadable MP4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoRenderInput"
      responses:
        "200":
          description: Completed video for an approved project
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid video brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /social/providers:
    get:
      operationId: listSocialProviders
      tags: [social]
      summary: Show publishing provider setup and account status
      responses:
        "200":
          description: Social provider status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialProviderStatus"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List app accounts for an administrator
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Change an account role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: Updated account role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid role change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [admin]
      summary: Create a one-time temporary password for an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Temporary password, shown only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPassword"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    UserRole:
      type: string
      enum: [user, admin]
    SessionUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        mustChangePassword:
          type: boolean
      required: [id, fullName, username, role, mustChangePassword]
    SignUpInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]+$"
        password:
          type: string
          minLength: 6
          maxLength: 128
        bootstrapToken:
          type: string
          maxLength: 256
      required: [fullName, username, password]
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [username, password]
    PasswordChangeInput:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 6
          maxLength: 128
      required: [currentPassword, newPassword]
    Scene:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        narration:
          type: string
        visualDirection:
          type: string
        seconds:
          type: integer
          minimum: 1
          maximum: 90
        shotType:
          type: string
        visualMetaphor:
          type: string
        onScreenText:
          type: string
        cameraMove:
          type: string
        soundCue:
          type: string
      required: [id, title, narration, visualDirection, seconds]
    ProjectInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        topic:
          type: string
          maxLength: 2000
        script:
          type: string
          maxLength: 20000
        hook:
          type: string
          maxLength: 1000
        takeaway:
          type: string
          maxLength: 1000
        engine:
          type: string
          enum: [model, code]
        styleId:
          type: string
          maxLength: 20
        aspectRatio:
          type: string
          enum: ["16:9", "9:16"]
        durationSeconds:
          type: integer
          minimum: 15
          maximum: 600
        voiceover:
          type: boolean
        subtitles:
          type: boolean
        soundEffects:
          type: boolean
        scenes:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/Scene"
      required:
        - title
        - topic
        - script
        - hook
        - takeaway
        - engine
        - styleId
        - aspectRatio
        - durationSeconds
        - voiceover
        - subtitles
        - soundEffects
        - scenes
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            approvedAt:
              type: ["string", "null"]
              format: date-time
          required: [id, createdAt, updatedAt, approvedAt]
    StoryboardGenerateInput:
      type: object
      properties:
        topic:
          type: string
          minLength: 3
          maxLength: 2000
        sourceScript:
          type: string
          maxLength: 20000
        styleId:
          type: string
          maxLength: 20
        aspectRatio:
          type: string
          enum: ["16:9", "9:16"]
        durationSeconds:
          type: integer
          minimum: 15
          maximum: 600
      required: [topic, styleId, aspectRatio, durationSeconds]
    StoryboardDraft:
      type: object
      properties:
        title:
          type: string
        script:
          type: string
        hook:
          type: string
        takeaway:
          type: string
        scenes:
          type: array
          minItems: 3
          maxItems: 12
          items:
            $ref: "#/components/schemas/Scene"
      required: [title, script, hook, takeaway, scenes]
    VideoRenderInput:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
      required: [projectId]
    SocialProviderStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [youtube, instagram, tiktok]
        label:
          type: string
        configured:
          type: boolean
        connected:
          type: boolean
        accountName:
          type: ["string", "null"]
        note:
          type: string
      required: [provider, label, configured, connected, accountName, note]
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time
        projectCount:
          type: integer
        mustChangePassword:
          type: boolean
      required:
          - id
          - fullName
          - username
          - role
          - createdAt
          - projectCount
          - mustChangePassword
    UserRoleInput:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
      required: [role]
    TemporaryPassword:
      type: object
      properties:
        temporaryPassword:
          type: string
        username:
          type: string
      required: [temporaryPassword, username]

